<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3; url=http://conerobotbasestation.local:8080">
  <title>Redirecting to RTK Base Station...</title>
  <script>
    fetch('/api/base_station')
      .then(r => r.json())
      .then(data => {
        if (data && data.url) {
          window.location.replace(data.url);
        } else {
          window.location.replace('http://conerobotbasestation.local:8080');
        }
      })
      .catch(() => {
        window.location.replace('http://conerobotbasestation.local:8080');
      });
  </script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 32px 48px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin: 0 0 12px 0; font-size: 1.4rem; color: #38bdf8; }
    p { margin: 0; color: #94a3b8; font-size: 0.95rem; }
    .spinner {
      margin: 20px auto 0;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h2>📡 Connecting to RTK Base Station</h2>
    <p>Locating active dynamic IP...</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
