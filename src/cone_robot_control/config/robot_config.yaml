# ==============================================================================
# CONE ROBOT MASTER CONFIGURATION FILE
# ==============================================================================

# 1. Raspberry Pi 5 Motor Driver Settings
mdd10_motor_controller:
  ros__parameters:
    # --- GPIO Pin Mapping (Raspberry Pi 5) ---
    pwm1_pin: 12   # Left Motor Speed PWM (GPIO 12)
    dir1_pin: 24   # Left Motor Direction (GPIO 24)
    pwm2_pin: 13   # Right Motor Speed PWM (GPIO 13)
    dir2_pin: 25   # Right Motor Direction (GPIO 25)

    # --- Physical Dimensions & Hardware Limits ---
    wheel_track: 0.290         # Distance between left & right wheels (meters)
    max_linear_speed: 1.0      # Maximum forward/reverse speed (m/s)
    max_angular_speed: 3.0     # Maximum turning speed (rad/s)
    cmd_timeout: 0.5           # Safety timeout (seconds)
    mock_hardware: false       # Set true for simulation / laptop dry-run

# 2. BNO08x IMU Sensor Settings (MikroE Click / I2C)
bno08x_node:
  ros__parameters:
    i2c_address: 74            # 0x4A in decimal
    frame_id: "imu_link"       # IMU TF frame
    publish_rate_hz: 50.0      # Output publication frequency (Hz)
    mount_flipped: true        # Sensor mounted upside down (applies 180-deg roll rotation)
    use_game_rotation: true    # 6-DOF fused orientation (immune to motor magnetic noise)
    mock_hardware: false       # Set true for simulation / dry-run without I2C hardware

    # --- INA219 Battery Monitor Settings (Shares I2C Bus, 0 MB Extra RAM) ---
    enable_battery_monitor: true   # Enable 0-RAM battery monitor on shared I2C bus
    battery_i2c_address: 64        # 0x40 in decimal (default CJMCU-219 / INA219 address)
    battery_publish_rate_hz: 1.0   # 1 Hz battery update (ultra-low bus load)
    battery_min_v: 10.5            # 3S LiPo cutoff voltage (3.5V / cell)
    battery_max_v: 12.6            # 3S LiPo 100% full voltage (4.2V / cell)
    battery_low_warn_v: 11.1       # 3S LiPo warning threshold (3.7V / cell)

# 3. Waveshare LC29H(DA) GPS/RTK & NTRIP Rover Settings
lc29h_gps_node:
  ros__parameters:
    serial_port: "/dev/ttyAMA0"
    baud_rate: 115200
    frame_id: "gps_link"
    publish_rate_hz: 10.0
    mock_hardware: false

    # --- NTRIP RTK Correction Stream Configuration ---
    ntrip_enable: true

    # Option A: Local Base Station Pi (Auto-resolves across any router/hotspot via mDNS)
    ntrip_caster: "conerobotBaseStation.local"  # Resolves automatically (or use direct IP if mDNS is disabled)
    ntrip_port: 2101                  # Base Station NTRIP port
    ntrip_mountpoint: "BASE"          # Base Station mountpoint
    ntrip_user: "conerobot"           # Local username
    ntrip_password: "none"            # Local password
    ntrip_send_gga: false             # Set false for local single-base caster (no VRS needed)

    # Option B: Public RTK2Go Caster (Pforzheim Station)
    # ntrip_caster: "rtk2go.com"
    # ntrip_port: 2101
    # ntrip_mountpoint: "PFORZEM"
    # ntrip_user: "conerobot@gmail.com"
    # ntrip_password: "none"
    # ntrip_send_gga: true

# 4. Step Motion Controller (Turn X deg & Drive Y cm)
step_motion_controller:
  ros__parameters:
    control_rate_hz: 20.0             # Control loop execution frequency
    
    # --- Turning Parameters (IMU Closed Loop) ---
    turn_kp: 0.08                     # Proportional gain for turning (snappier approach)
    turn_tolerance_deg: 2.0           # Heading error threshold in degrees
    min_turn_speed: 0.70              # Assertive turn speed (rad/s) so it doesn't crawl at the end
    max_turn_speed: 1.5               # Maximum angular speed (rad/s)
    turn_settle_time_s: 0.10          # Fast settle time (0.10s) for immediate completion

    # --- Linear Driving Parameters ---
    default_linear_speed: 0.15        # Forward/reverse cruising speed (m/s)
    yaw_lock_kp: 0.12                 # Active IMU straight-line yaw correction gain
    calibrated_speed_mps: 0.25        # Measured speed for open-loop time integration fallback

    # --- Multi-Sensor Distance Tracking ---
    # Options: 'auto' (detects odom -> gps -> time), 'odom', 'gps', 'time'
    distance_source: "auto"
    gps_require_rtk: true             # Require RTK Fix/Float to use GPS distance
    mock_mode: false

# 5. High-Level Primitive Motion Controller (Straight, Turn, Arc)
primitive_motion_controller:
  ros__parameters:
    control_rate_hz: 50.0             # Control loop execution frequency (synced with IMU)
    feedback_rate_hz: 10.0            # Action feedback publication frequency
    
    # --- Velocity Limits & Acceleration Profiles ---
    default_linear_speed: 0.20        # Cruising linear speed (m/s)
    default_angular_speed: 1.00       # Cruising turning speed (rad/s)
    max_linear_speed: 0.50            # Absolute maximum linear speed (m/s)
    max_angular_speed: 1.80           # Absolute maximum angular speed (rad/s)
    max_linear_accel: 0.35            # Maximum linear acceleration (m/s^2)
    max_angular_accel: 1.50           # Maximum angular acceleration (rad/s^2)
    min_linear_speed: 0.08            # Minimum linear speed to overcome track friction
    min_angular_speed: 0.70           # Assertive turn speed to prevent motor stall & PWM whine (matches step controller)

    # --- Skid-Steering Calibration ---
    wheel_track_geometric: 0.290      # Measured physical chassis track width (m)
    wheel_track_effective: 0.380      # Calibrated effective track width L_eff for lateral shear (m)

    # --- Feedback Control & Tolerances ---
    yaw_kp: 1.2                       # Fast 50 Hz IMU heading correction gain
    yaw_ki: 0.15                      # Integral error accumulator gain
    yaw_tolerance_rad: 0.040          # Angle completion tolerance (~2.3 deg)
    distance_tolerance_m: 0.03        # Distance completion tolerance (3 cm)
    stuck_detect_time_s: 0.6          # Stall watchdog abort timeout (seconds)
    distance_source: "auto"           # Multi-sensor distance tracking ('auto', 'odom', 'time')

# 6. Teleop Keyboard Settings (Laptop)
teleop_keyboard:
  ros__parameters:
    default_linear_speed: 0.2
    default_angular_speed: 0.5

# 6. Vision & Camera Settings (Future Modules)
cone_detector:
  ros__parameters:
    camera_topic: "/camera/image_raw"
    target_cone_color: "orange"