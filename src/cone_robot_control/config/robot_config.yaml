# ==============================================================================
# CONE ROBOT MASTER CONFIGURATION FILE
# ==============================================================================

# 1. Raspberry Pi 5 Motor Driver Settings (Cytron MDD10 Rev 2.0)
mdd10_motor_controller:
  ros__parameters:
    # --- GPIO Pin Mapping (Raspberry Pi 5) ---
    pwm1_pin: 12               # Left Motor Speed PWM (GPIO 12)
    dir1_pin: 24               # Left Motor Direction (GPIO 24)
    pwm2_pin: 13               # Right Motor Speed PWM (GPIO 13)
    dir2_pin: 25               # Right Motor Direction (GPIO 25)

    # --- Physical Dimensions, Deadband & Trim Calibration ---
    wheel_track: 0.380         # Effective track width L_eff for skid-steer slip (meters)
    max_linear_speed: 0.50     # Physical track speed at 100% PWM duty cycle (m/s)
    max_angular_speed: 2.50    # Maximum turning speed (rad/s)
    min_pwm: 0.12              # Static friction deadband duty cycle [0.0 - 0.35]
    left_motor_trim: 1.00      # Left track speed multiplier (adjust e.g. 0.98 or 1.02 if needed)
    right_motor_trim: 1.00     # Right track speed multiplier
    nominal_battery_v: 12.0    # Reference 3S LiPo voltage for automatic PWM compensation
    cmd_timeout: 0.5           # Safety watchdog timeout (seconds)

# 2. BNO08x IMU Sensor Settings (MikroE Click / I2C)
bno08x_node:
  ros__parameters:
    i2c_address: 74            # 0x4A in decimal
    frame_id: "imu_link"       # IMU TF frame
    publish_rate_hz: 50.0      # Output publication frequency (Hz)
    mount_flipped: true        # Sensor mounted upside down (right-multiplies 180-deg roll)
    use_game_rotation: true    # 6-DOF fused orientation (immune to motor magnetic noise)

    # --- INA219 Battery Monitor Settings (Shares I2C Bus, 0 MB Extra RAM) ---
    enable_battery_monitor: true   # Enable 0-RAM battery monitor on shared I2C bus
    battery_i2c_address: 64        # 0x40 in decimal (default CJMCU-219 / INA219 address)
    battery_publish_rate_hz: 1.0   # 1 Hz battery update (ultra-low bus load)
    battery_min_v: 10.5            # 3S LiPo cutoff voltage (3.5V / cell)
    battery_max_v: 12.6            # 3S LiPo 100% full voltage (4.2V / cell)
    battery_low_warn_v: 11.1       # 3S LiPo warning threshold (3.7V / cell)

# 3. Waveshare LC29H(DA) GPS/RTK & NTRIP Rover Settings
lc29h_gps_node:
  ros__parameters:
    serial_port: "/dev/ttyAMA0"
    baud_rate: 115200
    frame_id: "gps_link"
    publish_rate_hz: 10.0

    # --- NTRIP RTK Correction Stream Configuration ---
    ntrip_enable: true
    ntrip_caster: "auto"              # 'auto' (or 'conerobotBaseStation.local')
    ntrip_port: 2101                  # Base Station NTRIP port
    ntrip_mountpoint: "BASE"          # Base Station mountpoint
    ntrip_user: "conerobot"           # Local username
    ntrip_password: "none"            # Local password
    ntrip_send_gga: false             # Set false for local single-base caster (no VRS needed)

# 4. Unified State-Driven Motion Primitive Controller (Straight, Rotate, Arc)
primitive_motion_controller:
  ros__parameters:
    control_rate_hz: 50.0             # Fast inner control loop (synced with 50 Hz IMU)
    feedback_rate_hz: 10.0            # Action feedback publication rate

    # --- SINGLE ROBOT TYPE SWITCH: "gps" (GPS Robot) or "odom" (LiDAR Robot) ---
    distance_source: "gps"            # Change ONLY this to "odom" for the LiDAR robot!
    gps_require_rtk: false            # false = accepts RTK Fix/Float/DGPS/3D Fix; true = strict RTK only

    # --- Velocity Limits & State-Based Braking Profiles ---
    default_linear_speed: 0.22        # Cruising linear speed (m/s)
    default_angular_speed: 1.00       # Cruising turning speed (rad/s)
    max_linear_speed: 0.50            # Absolute maximum linear speed (m/s)
    max_angular_speed: 1.80           # Absolute maximum angular speed (rad/s)
    max_linear_accel: 0.35            # Linear acceleration & deceleration rate (m/s^2)
    max_angular_accel: 1.50           # Angular acceleration & deceleration rate (rad/s^2)
    min_linear_speed: 0.08            # Minimum linear speed before target stop (m/s)
    min_angular_speed: 0.65           # Minimum pivot speed to overcome track friction (rad/s)

    # --- Skid-Steering Calibration ---
    wheel_track_geometric: 0.290      # Measured physical chassis track width (m)
    wheel_track_effective: 0.380      # Calibrated effective track width L_eff for lateral shear (m)

    # --- Closed-Loop IMU Heading & Arc Curvature Gains ---
    yaw_kp: 2.0                       # Proportional heading correction gain (rad/s per rad error)
    yaw_ki: 0.60                      # Integral gain to automatically trim track asymmetry
    yaw_kd: 0.20                      # Gyro rate damping gain
    yaw_tolerance_rad: 0.031          # Angle completion tolerance (~1.8 deg)
    turn_settle_time_s: 0.15          # Standstill verification duration at target (seconds)
    distance_tolerance_m: 0.03        # Distance completion tolerance (3 cm)
    stuck_detect_time_s: 2.5          # Stall watchdog abort timeout (seconds)
